{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'inventory/includes/head.html' %}

    <!-- Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
</head>

<body class="main-bg main-bg-opac main-bg-blur roundedui adminuiux-header-standard adminuiux-sidebar-standard adminuiux-mobile-footer-fill-theme adminuiux-header-transparent theme-pista bg-r-gradient adminuiux-sidebar-fill-none scrollup">

{% include 'inventory/includes/header.html' %}

<div class="adminuiux-wrap">
    {% include 'inventory/includes/sidebar.html' %}

    <main class="adminuiux-content has-sidebar">

        <!-- Header -->
        <div class="container mt-3">
            <div class="row align-items-center">
                <div class="col">
                    <h4>Crew Allocation</h4>
                </div>
            </div>
        </div>

        <!-- FORM -->
        <div class="container mt-3">
            <div class="card">
                <div class="card-body">

                    <div class="row">

                        <!-- EVENT -->
                        <div class="col-md-4">
                            <label>Event</label>
                            <select id="eventSelect" class="form-control"></select>
                        </div>

                        <!-- FROM -->
                        <div class="col-md-3">
                            <label>From</label>
                            <input type="text" id="event_from" class="form-control" readonly>
                        </div>

                        <!-- TO -->
                        <div class="col-md-3">
                            <label>To</label>
                            <input type="text" id="event_to" class="form-control" readonly>
                        </div>

                    </div>

                    <div class="row mt-3">

                        <!-- EMPLOYEES -->
                        <div class="col-md-4">
                            <label>Employees</label>
                            <select id="employeeSelect" class="form-control" multiple></select>
                        </div>

                        <!-- AREA -->
                        <div class="col-md-3">
                            <label>Area of Work</label>
                            <select id="areaSelect" class="form-control"></select>
                        </div>

                        <!-- DATE -->
                        <div class="col-md-3">
                            <label>Work Date</label>
                            <input type="date" id="work_date" class="form-control">
                        </div>

                    </div>

                    <button type="button" class="btn btn-theme mt-3" onclick="saveAllocation()">Save</button>
                    <button type="button" class="btn btn-outline-secondary mt-3" onclick="resetForm()">Cancel</button>
                </div>
            </div>
        </div>

        <!-- LIST -->
        <div class="container mt-3">
            <div class="card">
                <div class="card-body">
                    <h6>Crew Allocation List</h6>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Event</th>
                                <th>Employee</th>
                                <th>Area</th>
                                <th>Work Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="allocationList"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
</div>

{% include 'inventory/includes/footer.html' %}

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    $('#eventSelect').select2();
    $('#employeeSelect').select2();
    $('#areaSelect').select2();

    loadEvents();
    loadEmployees();
    loadAreas();
    loadAllocations();
});


// 🔹 LOAD EVENTS
function loadEvents() {
    fetch("/get-events/")
    .then(res => res.json())
    .then(data => {

        const select = document.getElementById("eventSelect");

        data.data.forEach(ev => {
            const option = document.createElement("option");
            option.value = ev.event_id;
            option.text = ev.event_name;
            option.setAttribute("data-from", ev.event_date_from);
            option.setAttribute("data-to", ev.event_date_to);
            select.appendChild(option);
        });

        $('#eventSelect').trigger('change');

        $('#eventSelect').on("change", function () {
            const selected = this.options[this.selectedIndex];

            document.getElementById("event_from").value = selected.getAttribute("data-from");
            document.getElementById("event_to").value = selected.getAttribute("data-to");
        });
    });
}


// 🔹 LOAD EMPLOYEES
function loadEmployees() {
    fetch("/get-employees/")
    .then(res => res.json())
    .then(data => {
        const select = document.getElementById("employeeSelect");

        data.data.forEach(emp => {
            const option = document.createElement("option");
            option.value = emp.emp_id;
            option.text = emp.emp_name;
            select.appendChild(option);
        });
    });
}


// 🔹 LOAD AREAS
function loadAreas() {
    fetch("/get-areas/")
    .then(res => res.json())
    .then(data => {
        const select = document.getElementById("areaSelect");

        data.data.forEach(a => {
            const option = document.createElement("option");
            option.value = a.area_id;
            option.text = a.area_name;
            select.appendChild(option);
        });
    });
}


// 🔹 SAVE
function saveAllocation() {

    console.log("SAVE CLICKED");  // 👈 MUST PRINT

    const event_id = document.getElementById("eventSelect").value;
    const emp_ids = $('#employeeSelect').val();
    const area_id = document.getElementById("areaSelect").value;
    const work_date = document.getElementById("work_date").value;

    console.log(event_id, emp_ids, area_id, work_date);  // 👈 DEBUG

    if (!event_id || !emp_ids || !area_id || !work_date) {
        alert("Fill all fields");
        return;
    }

    const formData = new FormData();

    formData.append("event_id", event_id);
    formData.append("area_id", area_id);
    formData.append("work_date", work_date);

    emp_ids.forEach(id => formData.append("emp_ids[]", id));

    fetch("/save-crew-allocation/", {
        method: "POST",
        body: formData,
        headers: {"X-CSRFToken": getCookie("csrftoken")}
    })
    .then(res => res.json())
    .then(data => {
        console.log("SAVE RESPONSE:", data);

        if (!data.success) {
            alert("Error saving");
            return;
        }

        alert("Crew allocated successfully ✅");
        loadAllocations();
        resetForm();   // 👈 add reset
    })
    .catch(err => {
        console.error("SAVE ERROR:", err);
    });
}

// 🔹 LIST
function loadAllocations() {
    fetch("/get-allocations/")
    .then(res => res.json())
    .then(data => {

        const table = document.getElementById("allocationList");
        table.innerHTML = "";

        data.data.forEach(row => {
            table.innerHTML += `
                <tr>
                    <td>${row.event_name}</td>
                    <td>${row.emp_name}</td>
                    <td>${row.area_name}</td>
                    <td>${row.work_date}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger"
                            onclick="deleteAllocation(${row.allocation_id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `;
        });
    });
}


// 🔹 CSRF
function getCookie(name) {
    let cookieValue = null;
    document.cookie.split(';').forEach(cookie => {
        cookie = cookie.trim();
        if (cookie.startsWith(name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        }
    });
    return cookieValue;
}

function resetForm() {

    document.getElementById("eventSelect").value = "";
    document.getElementById("event_from").value = "";
    document.getElementById("event_to").value = "";
    document.getElementById("areaSelect").value = "";
    document.getElementById("work_date").value = "";

    $('#employeeSelect').val(null).trigger('change');

    alert("Form cleared");
}

function testClick() {
    alert("Button working");
}

function deleteAllocation(id) {

    if (!confirm("Delete this allocation?")) return;

    fetch(`/delete-crew-allocation/${id}/`, {
        method: "POST",
        headers: {"X-CSRFToken": getCookie("csrftoken")}
    })
    .then(res => res.json())
    .then(data => {

        if (!data.success) {
            alert("Error deleting");
            return;
        }

        alert("Deleted successfully 🗑️");
        loadAllocations();
    })
    .catch(err => {
        console.error(err);
        alert("Something went wrong");
    });
}

</script>

</body>
</html>
